[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "yesod-prepress-analyzer"
version = "0.1.0"
description = "Deterministic open-source PDF preflight service for Yesod Prepress AI"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "celery[redis]==5.5.3",
  "fastapi==0.116.1",
  "fonttools==4.59.0",
  "httpx==0.28.1",
  "pikepdf==9.9.0",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "pypdfium2==4.30.1",
  "redis==5.2.1",
  "shapely==2.1.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "pytest-cov==6.2.1", "ruff==0.12.7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/core/security.py" = ["I001"]
"app/rules/registry.py" = ["I001"]
"tests/contracts/test_job_request.py" = ["I001"]

[tool.coverage.run]
branch = true
source = ["app"]
