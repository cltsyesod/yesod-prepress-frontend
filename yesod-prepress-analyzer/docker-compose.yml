services:
  api:
    build: .
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000']
    env_file: .env
    # Só local: em produção o acesso público passa pelo Caddy (docker-compose.prod.yml).
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1770,uid=10001,gid=10001
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  worker:
    build: .
    command:
      [
        'celery',
        '-A',
        'app.workers.celery_app:celery_app',
        'worker',
        '--loglevel=INFO',
        '--queues=prepress',
        '--concurrency=2',
      ]
    env_file: .env
    depends_on:
      valkey:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=4g,mode=1770,uid=10001,gid=10001
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command:
      [
        'valkey-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - valkey-data:/data
    restart: unless-stopped

volumes:
  valkey-data:
